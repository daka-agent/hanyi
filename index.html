<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>寒衣 · 十月朔前九日</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0F10'/%3E%3Cellipse cx='16' cy='18' rx='9' ry='7' fill='%23E8DCC0'/%3E%3Ccircle cx='16' cy='15' r='3' fill='%23FFB26B'/%3E%3C/svg%3E">
<style>
/* 《寒衣》样式 · 单文件内联 */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #000; overflow: hidden; }
body { font-family: "Songti SC", "Noto Serif SC", "SimSun", serif; color: #C9C4B4; }

#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
#frame { position: relative; background: #000; }
#cv { display: block; width: 100%; height: 100%; }

/* 交互热区：透明 DOM 覆盖 */
#hotspots { position: absolute; inset: 0; }
.hs { position: absolute; border: 0; background: transparent; cursor: pointer; padding: 0; }
.hs:focus { outline: 1px dashed rgba(232,220,192,.4); }
.hs .ring { position: absolute; inset: 0; border-radius: 8px; opacity: 0; }
.hs.pulse .ring { animation: hspulse 1.6s ease-in-out infinite; }
@keyframes hspulse {
  0%, 100% { opacity: 0; box-shadow: 0 0 0 0 rgba(180,74,60,0); }
  50% { opacity: 1; box-shadow: 0 0 18px 3px rgba(180,74,60,.45); border: 1px solid rgba(180,74,60,.7); }
}

/* 旁白：整条抬到灯笼之上（12.5% 高 = 灯笼顶沿 1172 上方留 27px 呼吸）。
   原来贴底 bottom:0，文字盒 1148~1199 与灯笼 1172~1238 垂直重叠 27px，
   字压在灯头上、渐变又把灯压暗——底部这块地归灯，字往上让。 */
#narr { position: absolute; left: 0; right: 0; bottom: 12.5%; padding: 28px 26px 22px;
  /* 上下两端都要渐隐，否则层底会在画面上切出一条硬边。
     用固定 px 而不是 %：字号是固定 px、不随画布缩放，底色也得跟着字走 */
  background: linear-gradient(to top, rgba(5,8,9,0) 0, rgba(5,8,9,.9) 24px,
    rgba(5,8,9,.9) 74px, rgba(5,8,9,0) 108px);
  font-size: 17px; line-height: 2.0; letter-spacing: .08em;
  color: #8A9C8F; text-shadow: 0 1px 6px #000; user-select: none; cursor: pointer; }
#narr.her { color: #E8DCC0; font-size: 18px; }
#narr.paper { color: #6f8276; font-style: italic; }
/* 无旁白时让出点击、并且不给底色：
   旁白层抬到 12.5% 后，空层若还带着渐变，会在题名页中间切出一条黑带 */
#narr:empty { pointer-events: none; background: none; }
#narr .cursor { display: inline-block; width: .6em; animation: blink 1s steps(1) infinite; color: #8A9C8F; }
@keyframes blink { 50% { opacity: 0; } }
#notebtn { display: inline-block; margin-left: 10px; color: #B44A3C; border: 1px solid rgba(180,74,60,.6);
  border-radius: 50%; width: 22px; height: 22px; line-height: 21px; text-align: center; font-size: 13px;
  vertical-align: 2px; cursor: pointer; }

/* 手持物 */
#inv { position: absolute; left: 12px; bottom: 22.5%; display: flex; gap: 8px; flex-wrap: wrap; max-width: 70%; }
.chip { background: rgba(11,15,16,.85); border: 1px solid #3a443f; color: #C9C4B4; border-radius: 4px;
  padding: 5px 10px; font-size: 14px; letter-spacing: .1em; cursor: pointer; }
.chip.sel { border-color: #B44A3C; color: #E8DCC0; box-shadow: 0 0 10px rgba(180,74,60,.4); }

/* 烛条 */
#candle { position: absolute; right: 10px; top: 14%; width: 10px; height: 22%; border: 1px solid #333c38;
  border-radius: 5px; background: rgba(11,15,16,.7); overflow: hidden; }
#candle i { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, #FF7A45, #FFB26B); }
#candle.low i { animation: candlelow 1s ease-in-out infinite; }
@keyframes candlelow { 50% { opacity: .55; } }

/* 顶栏 */
#topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
  padding: 10px 12px; z-index: 5; }
#topbar button { background: rgba(11,15,16,.6); color: #8A9C8F; border: 1px solid #2a332f; border-radius: 4px;
  font-family: inherit; font-size: 14px; padding: 5px 12px; letter-spacing: .15em; cursor: pointer; }

/* 静音模式音效文字 */
#caption { position: absolute; top: 46px; left: 0; right: 0; text-align: center; color: #5d6f64;
  font-size: 13px; letter-spacing: .3em; pointer-events: none; }

/* 模态（考据卡 / 注 / 菜单 / 输入） */
#modal { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(3,5,6,.88); z-index: 20; }
#modal.on { display: flex; }
#mbox { width: 86%; max-height: 82%; overflow-y: auto; background: #0B0F10; border: 1px solid #2a332f;
  border-radius: 8px; padding: 26px 24px; font-size: 14.5px; line-height: 2.0; color: #C9C4B4; }
#mbox h3 { color: #E8DCC0; font-size: 17px; letter-spacing: .3em; margin-bottom: 14px; font-weight: 600; }
#mbox .q { color: #8A9C8F; margin: 12px 0; padding-left: 12px; border-left: 2px solid #24302a; }
#mbox .q b { color: #C9C4B4; font-weight: 400; }
#mbox .fict { border: 1px dashed #3a443f; border-radius: 6px; padding: 12px 14px; margin-top: 16px;
  color: #8A9C8F; font-size: 13.5px; }
#mbox .fict b { color: #B44A3C; font-weight: 600; }
#mbox .disc { margin-top: 14px; color: #5d6f64; font-size: 12.5px; }
#mbox button, #modal button { background: none; border: 1px solid #3a443f; color: #C9C4B4; border-radius: 4px;
  font-family: inherit; font-size: 14px; padding: 7px 20px; letter-spacing: .2em; margin-top: 18px; cursor: pointer; }
#mbox button:hover, #modal button:hover { border-color: #B44A3C; color: #E8DCC0; }
#mbox img { width: 100%; border-radius: 6px; margin-top: 10px; }
#mbox input[type=text] { background: #070a0b; border: 1px solid #3a443f; color: #E8DCC0; border-radius: 4px;
  font-family: inherit; font-size: 17px; letter-spacing: .2em; padding: 9px 12px; width: 70%; text-align: center; }
.modebtn { display: block; width: 100%; margin: 10px 0 0 !important; text-align: center; }
.modebtn small { display: block; color: #5d6f64; letter-spacing: .05em; font-size: 12px; margin-top: 3px; }

/* 转场黑幕 */
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none;
  transition: opacity 1.2s ease; z-index: 30; }
#fade.on { opacity: 1; pointer-events: auto; }

/* 题名 */
#title-ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; z-index: 10; }
#title-ui .t { writing-mode: vertical-rl; font-size: 64px; letter-spacing: .35em; color: #E8DCC0;
  text-shadow: 0 0 30px rgba(255,178,107,.25); font-weight: 600; }
#title-ui .s { writing-mode: vertical-rl; font-size: 15px; letter-spacing: .5em; color: #8A9C8F; margin-top: 18px; }
/* 竖排字不能被 flex 压扁——一旦被压缩，浏览器会把竖排文字折成第二列，标题直接错位 */
#title-ui .t, #title-ui .s { flex: none; }
#title-ui .btns { display: flex; gap: 18px; margin-top: 56px; }
/* 题名页的「设 置」：模式属于设置项，入口要低调但可发现（无障碍需要它前置在题名页）
   放右上角，与左上角 ☰ 对称——竖着排会压到灯笼（下方那盏灯的辉光会把字糊掉） */
/* 字号写在这里而不是内联，否则 @media 覆盖不掉（内联优先级高于类选择器） */
#title-ui button.setlink { position: absolute; top: 10px; right: 12px; margin: 0;
  padding: 5px 9px 5px 13px; border: 1px solid #2a332f; border-radius: 4px;
  background: rgba(11,15,16,.6); font-size: 12px; letter-spacing: .2em; color: #8A9C8F; }
#title-ui button.setlink:hover { border-color: #B44A3C; color: #E8DCC0; }
#title-ui button { background: none; border: 1px solid #3a443f; color: #C9C4B4; border-radius: 4px;
  font-family: inherit; font-size: 16px; letter-spacing: .35em; padding: 10px 26px 10px 30px; cursor: pointer; }
#title-ui button:hover { border-color: #B44A3C; color: #E8DCC0; }
#title-ui .ft { position: absolute; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); width: 100%;
  text-align: center; color: #3d4a44; }
#title-ui .ft .decl { display: block; font-size: 11px; letter-spacing: .26em; color: #35403b; }
#title-ui .ft .sign { display: block; margin-top: 7px; font-size: 12px; letter-spacing: .3em; color: #4f5c54; }
/* 矮屏收紧：标题/副题是固定 px，视口越矮它们占比越大，会把「开 始」推到灯笼上
   （实测 375×667 按钮底 583 = 灯 583，360×780 压 11px）。缩字号 + 收间距，内容整体上移 */
@media (max-height: 860px) {
  #title-ui .t { font-size: 52px; }
  #title-ui .s { font-size: 13px; margin-top: 10px; }
  #title-ui .btns { margin-top: 26px; }
}

/* 大字（终章"天冷了，记得添衣。"） */
.bigline { font-size: 21px !important; color: #E8DCC0 !important; text-align: center;
  letter-spacing: .18em !important; line-height: 2.2; white-space: nowrap; }

/* 场景 DOM UI 层（题名/输入/终章按钮） */
#ui { position: absolute; inset: 0; pointer-events: none; z-index: 8; }
#ui > * { pointer-events: auto; }
#ui button { background: none; border: 1px solid #3a443f; color: #C9C4B4; border-radius: 4px;
  font-family: inherit; font-size: 16px; letter-spacing: .35em; padding: 10px 26px 10px 30px; cursor: pointer; }
#ui button:hover { border-color: #B44A3C; color: #E8DCC0; }
#ui input[type=text] { background: rgba(7,10,11,.9); border: 1px solid #3a443f; color: #E8DCC0; border-radius: 4px;
  font-family: inherit; font-size: 18px; letter-spacing: .2em; padding: 10px 14px; width: 240px; text-align: center; }

</style>
</head>

<div id="stage">
  <div id="frame">
    <canvas id="cv" width="750" height="1334"></canvas>
    <div id="hotspots"></div>
    <div id="inv"></div>
    <div id="candle"><i></i></div>
    <div id="caption"></div>
    <div id="topbar"><button onclick="G.pause()">☰</button><span></span></div>
    <div id="narr"></div>
    <div id="ui"></div>
    <div id="modal"><div id="mbox"></div></div>
    <div id="fade"></div>
  </div>
</div>

/* 青鬼火：烛灭引路 */
function drawGhost(c, x, y, t) {
  var f = Math.sin(2*Math.PI*t/1.1) * 0.18 + Math.sin(2*Math.PI*t/1.9) * 0.1;
  var s = 13;
  c.save(); c.translate(x, y);
  var halo = c.createRadialGradient(0, -s*0.5, 0, 0, -s*0.5, s*3.4);
  halo.addColorStop(0, "rgba(140,220,200,0.34)"); halo.addColorStop(1, "rgba(140,220,200,0)");
  c.fillStyle = halo; c.fillRect(-s*3.4, -s*3.8, s*6.8, s*7);
  c.fillStyle = "rgba(120,210,190,0.8)"; flamePath(c, s*(1+f)); c.fill();
  c.fillStyle = "rgba(214,245,235,0.9)"; flamePath(c, s*0.5*(1-f*0.6)); c.fill();
  c.restore();
}
function drawLantern(c, x, y, t, opts) {
  opts = opts || {};
  var rx = 44, ry = 32, cy = y + 30;
  var fuel = Math.max(G.candle, 0.05);
  c.save();
  if (opts.dim) c.globalAlpha = 0.45;
  drawFlame(c, x, cy + 12, 7 + 10 * fuel, t);
  var body = c.createLinearGradient(x, cy - ry, x, cy + ry);
  body.addColorStop(0, "rgba(240,228,200," + (0.5 + 0.25 * fuel) + ")");
  body.addColorStop(0.5, "rgba(232,220,192," + (0.42 + 0.2 * fuel) + ")");
  body.addColorStop(1, "rgba(196,180,148," + (0.44 + 0.24 * fuel) + ")");
  c.fillStyle = body;
  c.beginPath(); c.ellipse(x, cy, rx, ry, 0, 0, 6.283); c.fill();
  var glow = c.createRadialGradient(x, cy + 4, 2, x, cy + 4, rx * 0.95);
  glow.addColorStop(0, "rgba(255,178,107," + (0.2 + 0.35 * fuel) + ")");
  glow.addColorStop(0.6, "rgba(255,178,107," + (0.07 + 0.13 * fuel) + ")");
  glow.addColorStop(1, "rgba(255,178,107,0)");
  c.fillStyle = glow;
  c.beginPath(); c.ellipse(x, cy, rx, ry, 0, 0, 6.283); c.fill();
  c.strokeStyle = "rgba(90,74,52,0.5)"; c.lineWidth = 1.3;
  for (var i = -2; i <= 2; i++) {
    var k = i / 2.6;
    c.beginPath();
    c.moveTo(x + k*rx*0.55, cy - ry*Math.sqrt(1 - k*k*0.3));
    c.quadraticCurveTo(x + k*rx*1.02, cy, x + k*rx*0.55, cy + ry*Math.sqrt(1 - k*k*0.3));
    c.stroke();
  }
  c.strokeStyle = "rgba(60,48,34,0.8)"; c.lineWidth = 3;
  c.beginPath(); c.ellipse(x, cy - ry + 2, rx*0.42, 5, 0, 0, 6.283); c.stroke();
  c.beginPath(); c.ellipse(x, cy + ry - 2, rx*0.42, 5, 0, 0, 6.283); c.stroke();
  c.restore();
}

/* ================= 粒子 ================= */
function makeParticles(kind, n, box) {
  var arr = [];
  for (var i = 0; i < n; i++) {
    var p = { x: box.x + Math.random()*box.w, y: box.y + Math.random()*box.h,
              r: Math.random()*6.283, rs: (Math.random()-0.5)*1.6, ph: Math.random()*6.283, s: 1 + Math.random() };
    if (kind === "leaf") { p.vx = 6 + Math.random()*14; p.vy = 3 + Math.random()*7; p.sz = 5 + Math.random()*6; }
    if (kind === "ash") { p.vx = 2 + Math.random()*5; p.vy = -(5 + Math.random()*8); p.sz = 1.6 + Math.random()*2.4; }
    if (kind === "ember") { p.vx = (Math.random()-0.5)*8; p.vy = -(14 + Math.random()*16); p.sz = 1.8 + Math.random()*2.8; }
    arr.push(p);
  }
  return arr;
}
function drawParticles(c, kind, arr, dt, t) {
  for (var i = 0; i < arr.length; i++) {
    var p = arr[i];
    p.x += (p.vx + Math.sin(t*0.7 + p.ph)*6*p.s) * dt;
    p.y += p.vy * dt; p.r += p.rs * dt;
    if (p.y < -20) { p.y = H + 10; p.x = Math.random()*W; }
    if (p.y > H + 20) { p.y = -10; p.x = Math.random()*W; }
    if (p.x > W + 20) p.x = -10; if (p.x < -20) p.x = W + 10;
    c.save(); c.translate(p.x, p.y); c.rotate(p.r);
    if (kind === "leaf") {
      c.fillStyle = "rgba(74,62,44,0.5)";
      c.beginPath(); c.ellipse(0, 0, p.sz, p.sz*0.42, 0, 0, 6.283); c.fill();
    } else if (kind === "ash") {
      c.fillStyle = "rgba(138,156,143," + (0.16 + 0.12*Math.sin(t*2 + p.ph)) + ")";
      c.beginPath(); c.arc(0, 0, p.sz, 0, 6.283); c.fill();
    } else {
      c.globalCompositeOperation = "lighter";
      c.fillStyle = "rgba(255,150,80," + (0.25 + 0.3*Math.abs(Math.sin(t*2.2 + p.ph))) + ")";
      c.beginPath(); c.arc(0, 0, p.sz, 0, 6.283); c.fill();
    }
    c.restore();
  }
}

/* ================= 旁白引擎 =================
   say(lines, cb)：lines = [{t, who, note, big}]
   点击旁白：未完→补全；已完→收下一句。 */
var narrQ = [], narrCb = null, typing = null;
G.say = function (lines, cb) {
  if (typeof lines === "string") lines = [{ t: lines }];
  narrQ = narrQ.concat(lines);
  if (cb) narrCb = cb;
  if (!typing) nextLine();
};
function nextLine() {
  if (!narrQ.length) {
    typing = null; narrEl.className = ""; narrEl.innerHTML = "";
    G.narrLock = false;
    var cb = narrCb; narrCb = null;
    if (cb) cb();
    return;
  }
  G.narrLock = true;
  var L = narrQ.shift();
  var full = L.t, i = 0, who = L.who || "narr";
  narrEl.className = who === "her" ? "her" : (who === "paper" ? "paper" : "");
  if (L.big) narrEl.classList.add("bigline");
  typing = { full: full, L: L };
  clearInterval(typing.timer);
  typing.timer = setInterval(function () {
    i += 1;
    var s = full.slice(0, i);
    narrEl.innerHTML = s + '<span class="cursor">▏</span>' + (L.note && i >= full.length ? '<span id="notebtn">注</span>' : '');
    if (i >= full.length) {
      clearInterval(typing.timer); typing.timer = null;
      if (L.note) {
        var nb = el("notebtn");
        if (nb) nb.onclick = function (e) { e.stopPropagation(); openNote(L.note.title, L.note.body); };
      }
    }
  }, 46);
}
narrEl = null; // 真实元素在 boot 里绑定
G.narrTap = function () {
  if (!typing) return false;
  if (typing.timer) {           // 补全
    clearInterval(typing.timer); typing.timer = null;
    var L = typing.L;
    narrEl.innerHTML = L.t + (L.note ? '<span id="notebtn">注</span>' : '');
    if (L.note) el("notebtn").onclick = function (e) { e.stopPropagation(); openNote(L.note.title, L.note.body); };
  } else {                      // 收下一句
    typing = null; nextLine();
  }
  return true;
};
function openNote(title, body) {
  G.busy = true;
  el("mbox").innerHTML = "<h3>" + title + "</h3><div class='q'>" + body + "</div>" +
    "<button onclick='G.closeModal()'>收好</button>";
  el("modal").classList.add("on");
}
G.openNote = openNote;
G.closeModal = function () {
  el("modal").classList.remove("on");
  G.busy = false;
};
G.modal = function (html) {
  G.busy = true;
  el("mbox").innerHTML = html;
  el("modal").classList.add("on");
};

/* ================= 热区 ================= */
var hsPool = [];
function syncHotspots() {
  var list = (G.scene && G.scene.hotspots && !G.busy && !G.narrLock) ? G.scene.hotspots() : [];
  var want = {};
  list.forEach(function (h) { if (h.visible !== false) want[h.id] = h; });
  G._pulseObjId = null;
  for (var pi = 0; pi < list.length; pi++) { if (list[pi].obj) { G._pulseObjId = list[pi].id; break; } }
  hsPool.forEach(function (d) {
    var h = want[d.id];
    if (!h) { d.el.style.display = "none"; d.on = false; return; }
    d.el.style.display = "block"; d.on = true;
    d.el.style.left = (h.x / W * 100) + "%";
    d.el.style.top = (h.y / H * 100) + "%";
    d.el.style.width = (h.w / W * 100) + "%";
    d.el.style.height = (h.h / H * 100) + "%";
    d.el.classList.toggle("pulse", !!h.pulse);
  });
}
function buildHotspots() {
  var ids = [];
  Object.keys(G.scenes).forEach(function (k) {
    var hs = G.scenes[k].hsIds || [];
    hs.forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); });
  });
  ids.forEach(function (id) {
    var d = document.createElement("button");
    d.className = "hs"; d.style.display = "none";
    d.innerHTML = "<span class='ring'></span>";
    d.setAttribute("aria-label", id);
    d.addEventListener("click", function (e) {
      e.stopPropagation();
      G.touch();
      if (G.busy || G.narrLock || !G.scene) return;
      var h = null;
      var list = G.scene.hotspots() || [];
      for (var i = 0; i < list.length; i++) if (list[i].id === id) { h = list[i]; break; }
      if (h && h.visible !== false && G.scene.onTap) G.scene.onTap(id);
    });
    hsEl.appendChild(d);
    hsPool.push({ id: id, el: d, on: false });
  });
}

/* ================= 音频（Web Audio 程序合成，零音频文件） ================= */
var AC = null, master, droneG, windG, windF, beatT = 0, drumT = 20;

}
function ramp(p, v, t) { p.setValueAtTime(p.value, AC.currentTime); p.linearRampToValueAtTime(v, AC.currentTime + Math.max(0.4, t)); }
G.audio = {
  ensure: function () {
    var a = ac(); if (!a) return;
    if (a.state === "suspended") a.resume();
    if (!droneG) {
      droneG = a.createGain(); droneG.gain.value = 0; droneG.connect(master);
      [55, 55.3].forEach(function (f) {
        var o = a.createOscillator(); o.type = "sine"; o.frequency.value = f;
        o.connect(droneG); o.start();
      });
      ramp(droneG.gain, 0.0079, 1.5);          // ≈ -42dB
      var len = a.sampleRate * 2, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      var src = a.createBufferSource(); src.buffer = buf; src.loop = true;
      windF = a.createBiquadFilter(); windF.type = "lowpass"; windF.frequency.value = 400;
      windG = a.createGain(); windG.gain.value = 0.012;
      var lfo = a.createOscillator(); lfo.frequency.value = 0.11;
      var lg = a.createGain(); lg.gain.value = 0.010;
      lfo.connect(lg); lg.connect(windG.gain);
      src.connect(windF); windF.connect(windG); windG.connect(master);
      src.start(); lfo.start();
    }
  },
  setMode: function () {
    if (master) ramp(master.gain, G.mode === "mute" ? 0 : 0.9, 0.4);
  },
  caption: function (txt) {
    if (G.mode !== "mute") return;
    captionEl.textContent = txt;
    clearTimeout(captionEl._t);
    captionEl._t = setTimeout(function () { captionEl.textContent = ""; }, 2600);
  },
  blip: function (f, dur, vol, type) {   // 通用短音
    var a = ac(); if (!a || G.mode === "mute") return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine"; o.frequency.value = f || 660;
    g.gain.value = 0; o.connect(g); g.connect(master);
    g.gain.linearRampToValueAtTime(vol || 0.05, a.currentTime + 0.05);
    g.gain.linearRampToValueAtTime(0, a.currentTime + (dur || 0.4));
    o.start(); o.stop(a.currentTime + (dur || 0.4) + 0.1);
  },
  creak: function () {
    var a = ac(); if (!a || G.mode === "mute") return;
    var len = a.sampleRate * 0.6, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    var s = a.createBufferSource(); s.buffer = buf;
    var f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 800; f.Q.value = 4;
    var g = a.createGain(); g.gain.value = 0.10;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  },
  drum: function () {
    var a = ac(); if (!a || G.mode === "mute") return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = "triangle"; o.frequency.value = 120;
    g.gain.value = 0; o.connect(g); g.connect(master);
    g.gain.linearRampToValueAtTime(0.05, a.currentTime + 0.03);
    g.gain.linearRampToValueAtTime(0, a.currentTime + 0.5);
    o.start(); o.stop(a.currentTime + 0.6);
  },
  burn: function (dur) {                 // 焚衣：噪声渐强 + lowpass 上扫
    var a = ac(); if (!a || G.mode === "mute") return;
    var len = a.sampleRate * dur, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random()*2-1;
    var s = a.createBufferSource(); s.buffer = buf;
    var f = a.createBiquadFilter(); f.type = "lowpass";
    f.frequency.setValueAtTime(300, a.currentTime);
    f.frequency.linearRampToValueAtTime(2400, a.currentTime + dur);
    var g = a.createGain(); g.gain.value = 0;
    g.gain.linearRampToValueAtTime(0.14, a.currentTime + dur * 0.7);
    g.gain.linearRampToValueAtTime(0, a.currentTime + dur + 0.6);
    s.connect(f); f.connect(g); g.connect(master); s.start();
  },
  wail: function () {                    // 终章彩蛋：女声十九，男声十一
    var a = ac(); if (!a || G.mode === "mute") return;
    var cries = [[880, 660], [660, 880], [880, 660], [660, 880], [880, 660],

    cries.forEach(function (cr, i) {
      var t0 = AC.currentTime + 0.15 + i * 0.14;
      var o = AC.createOscillator(), g = AC.createGain();

      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.012, t0 + 0.05);
      g.gain.linearRampToValueAtTime(0, t0 + 0.13);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 0.2);
    });
  }
};
function heartbeat(bpm) {
  // timid 也要跳过：开场文案承诺「去掉心跳与镜头抖动」，胆小模式是给怕的人用的，
  // 心跳恰恰是最催人的那层。10-26 修：原先只判 mute，文案与代码不符。
  var a = AC; if (!a || G.mode === "mute" || G.mode === "timid") return;
  beatT -= 1;
  if (beatT > 0) return;
  beatT = 60 / bpm * 30; // 以 30fps 帧计
  [0, 0.18].forEach(function (off, k) {
    var t0 = a.currentTime + off;
    var o = a.createOscillator(), g = a.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(58, t0);
    o.frequency.exponentialRampToValueAtTime(40, t0 + 0.12);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(k ? 0.035 : 0.055, t0 + 0.02);
    g.gain.linearRampToValueAtTime(0, t0 + 0.16);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 0.2);
  });

/* ================= 烛 ================= */
var CANDLE_FULL = 540;           // 满烛 ≈ 9 分钟（呼应"距十月朔九日"）
G.windLean = 0;
G.wind = function (sec) {
  G.windT = sec || 2;
  G.burnExtra(3 / 100);
  G.audio.creak();
  G.audio.caption("【风声】");
};
G.burnExtra = function (v) {
  G.candle = Math.max(0, G.candle - v);
  if (G.candle <= 0) G.candle = 0;
};
G.addCandle = function (v) {
  G.candle = Math.min(1, G.candle + v);
  G.darkTime = 0;
};
function tickCandle(dt) {
  if (G.scene && G.scene.noBurn) return;
  var rate = 1 / CANDLE_FULL;
  if (G.windT > 0) { rate *= 1.6; G.windT -= dt; }
  G.candle = Math.max(0, G.candle - rate * dt);
  if (G.candle <= 0.005) G.darkTime += dt; else G.darkTime = 0;
  // 烛灭 30 秒：一盏青色鬼火飘来引路（每 30 秒一次）
  if (G.darkTime > 30 && G.scene && G.scene.objective && G.ghostUntil < G.t && !G.busy) {
    G.darkTime = 0;
    G.ghostUntil = G.t + 12;
    G.audio.caption("【青火】");
    if (!G.narrLock) G.say([{ t: "（一盏青火，慢悠悠飘在前头。）" }]);
  }
}
function drawCandleUI() {
  var bar = candleEl.firstElementChild;
  bar.style.height = (G.candle * 100) + "%";
  candleEl.classList.toggle("low", G.candle < 0.25);
  var show = !(G.scene && G.scene.noBurn);
  candleEl.style.display = show ? "block" : "none";
}

/* ================= 风 / 更鼓 / 提示（单提示权威） ================= */
var gustTimer = 40, idleHint = 0;
function tickAmbient(dt) {
  gustTimer -= dt;
  if (gustTimer <= 0 && !(G.scene && G.scene.noBurn)) {
    gustTimer = 45 + Math.random() * 30;
    if (G.scene && G.scene.windOk !== false) G.wind(2);
  }
  drumT -= dt;
  if (drumT <= 0) { drumT = 40 + Math.random() * 20; G.audio.drum(); G.audio.caption("【远处更鼓】"); }
  // 威胁值 → 心跳 60–90bpm
  var threat = 0;
  if (G.candle < 0.3) threat = Math.max(threat, 0.6);
  if (G.scene && G.scene.threat) threat = Math.max(threat, G.scene.threat());
  if (threat > 0) heartbeat(60 + threat * 30);
  // 闲置提示：60s 照亮关键物，90s 旁白一句
  var idle = G.t - G.lastAct;
  if (G.scene && G.scene.objective && !G.narrLock && !G.busy) {
    if (idle > 90 && idleHint < 2) {
      idleHint = 2;
      var h = G.scene.hint();
      if (h) G.say(h);
    } else if (idle > 60 && idleHint < 1) idleHint = 1;
  }

G.touch = function () {
  G.lastAct = G.t; idleHint = 0;
  G.audio.ensure();
};
/* pulse 用上一帧的热区列表，避免与 hotspots() 互相递归 */
G.pulseObjective = function () {
  return ((idleHint >= 1 || G.ghostUntil > G.t) && G._pulseObjId) ? G._pulseObjId : null;
};

/* ================= 光影层 ================= */
var lcv = document.createElement("canvas"), lctx = lcv.getContext("2d");
lcv.width = W / 2; lcv.height = H / 2;
G.lanternPos = { x: W * 0.5, y: H * 0.87 };
G.lanternDim = false;

function lightRadius() {
  return 230 + 300 * G.candle;
}
function renderLight(t) {
  var warm = G.scene && G.scene.warm;
  var L = G.lanternPos;
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.globalCompositeOperation = "source-over";
  var dark = warm ? 0.06 : (0.94 - 0.5 * Math.max(G.candle, 0.04));
  if (G.mode === "timid") dark = Math.min(0.97, dark * 1.05);
  lctx.fillStyle = "rgba(4,7,8," + dark + ")";
  lctx.fillRect(0, 0, W / 2, H / 2);

  var punches = [{ x: L.x, y: L.y - H * 0.28, r: R, ry: R * 1.9, a: warm ? 0.9 : 0.95 }];
  extra.forEach(function (e) { punches.push({ x: e.x, y: e.y, r: e.r, ry: e.r, a: e.a != null ? e.a : 0.9 }); });
  punches.forEach(function (p) {
    lctx.save();
    lctx.translate(p.x / 2, p.y / 2);
    lctx.scale(1, p.ry / p.r);
    var g = lctx.createRadialGradient(0, 0, 0, 0, 0, p.r / 2);
    g.addColorStop(0, "rgba(0,0,0," + p.a + ")");
    g.addColorStop(0.55, "rgba(0,0,0," + p.a * 0.58 + ")");
    g.addColorStop(1, "rgba(0,0,0,0)");
    lctx.fillStyle = g;
    lctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
    lctx.restore();
  });
  lctx.globalCompositeOperation = "source-over";
  ctx.drawImage(lcv, 0, 0, W, H);
  // 暖溢光
  var flick = 0.5 + 0.5 * Math.sin(2 * Math.PI * t / 1.6 + 1);
  var g3 = ctx.createRadialGradient(L.x, L.y - H * 0.12, 0, L.x, L.y - H * 0.12, R * 1.6);
  g3.addColorStop(0, "rgba(255,178,107," + (warm ? 0.05 : 0.12 + 0.03 * flick) + ")");
  g3.addColorStop(1, "rgba(255,178,107,0)");
  ctx.fillStyle = g3; ctx.fillRect(0, 0, W, H);
  extra.forEach(function (p) {
    if (!p.cool) return;
    var g4 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 1.2);
    g4.addColorStop(0, "rgba(190,205,215,0.10)");
    g4.addColorStop(1, "rgba(190,205,215,0)");
    ctx.fillStyle = g4; ctx.fillRect(0, 0, W, H);
  });
}

/* ================= 主循环 ================= */
var lastFrame = 0, particles = null;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - lastFrame < 33) return;   // 30fps
  var dt = Math.min(0.08, (now - lastFrame) / 1000);
  lastFrame = now; G.t += dt;
  var t = G.t;
  if (!G.scene) return;
  tickCandle(dt);
  tickAmbient(dt);
  if (G.scene.update) G.scene.update(dt, t);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.save();
  var shake = (G.mode !== "timid" && !REDUCED && !(G.scene && G.scene.warm) && G.windT > 0) ? 1.5 : 0;
  if (shake) ctx.translate(1.5 * Math.sin(2 * Math.PI * 0.15 * t), 1.5 * Math.cos(2 * Math.PI * 0.13 * t));
  var bg = G.scene.bg;
  if (bg && G.imgs[bg]) ctx.drawImage(G.imgs[bg], 0, 0, W, H);
  if (G.scene.drawUnder) G.scene.drawUnder(ctx, t, dt);
  renderLight(t);
  if (G.scene.drawOver) G.scene.drawOver(ctx, t, dt);
  if (G.ghostUntil > t && G.scene.objective && G._pulseObjId) {
    var gt = null, gl2 = G.scene.hotspots() || [];
    for (var gi = 0; gi < gl2.length; gi++) if (gl2[gi].id === G._pulseObjId) { gt = gl2[gi]; break; }
    if (gt) {
      var gp = Math.min(1, 1 - (G.ghostUntil - t) / 12);
      var ge = 1 - Math.pow(1 - gp, 2);
      var gcx = gt.x + gt.w / 2, gcy = gt.y + gt.h / 2;
      drawGhost(ctx, W * 0.12 + (gcx - W * 0.12) * ge, H * 0.2 + (gcy - H * 0.2) * ge + Math.sin(2 * Math.PI * t / 2.2) * 8, t);
    }
  }
  if (particles) drawParticles(ctx, particles.kind, particles.arr, dt, t);
  var L = G.lanternPos;
  if (!(G.scene && G.scene.hideLantern)) {
    var bob = (REDUCED || (G.scene && G.scene.warm)) ? 0 : Math.sin(2 * Math.PI * t / 2.6) * 3;
    if (G.scene && G.scene.warm) drawFlame(ctx, L.x, L.y - 16, 24, t);
    else drawLantern(ctx, L.x, L.y + bob, t, { dim: G.lanternDim });
  }
  var va = (G.scene && G.scene.warm) ? 0.12 : (G.mode === "timid" ? 1.4 : 1);
  ctx.globalAlpha = Math.min(1, va);
  ctx.drawImage(VIGN, 0, 0);
  ctx.globalAlpha = 1;
  if (!REDUCED) {
    ctx.globalAlpha = 0.055;
    ctx.drawImage(GRAIN[(t * 8 | 0) % 3], 0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  drawCandleUI();
  syncHotspots();
}
G.setParticles = function (kind, box) {
  particles = kind ? { kind: kind, arr: makeParticles(kind, 10, box || { x: 0, y: 0, w: W, h: H }) } : null;
};

/* ================= 场景切换 ================= */
G.goto = function (id, opts) {
  opts = opts || {};
  G.busy = true;
  fadeEl.classList.add("on");
  G.audio.caption("【风声】");
  setTimeout(function () {
    if (G.scene && G.scene.leave) G.scene.leave();
    G.scene = G.scenes[id];
    G.flags.scene = id;
    if (!opts.noSave) G.save();
    // 统一清空 DOM UI 层：原先靠"谁导航谁负责清"，漏一次就会有一层
    // #title-ui 盖在场景上、吞掉上方热区（contGame 那次就是）。改成 goto 统一清，
    // 需要按钮的场景在自己 enter 里重新画。
    G.ui("");
    if (G.scene.enter) G.scene.enter(opts);
    fadeEl.classList.remove("on");
    G.busy = false;
  }, 1250);
};

/* ================= 存档 ================= */
G.save = function () {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      scene: G.flags.scene, candle: G.candle, name: G.name,
      flags: G.flags, mode: G.mode
    }));
  } catch (e) {}
};
G.loadSave = function () {
  try {
    var s = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    return s;
  } catch (e) { return null; }
};
G.clearSave = function () {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
};
G.saveMode = function () {
  try { localStorage.setItem(MODE_KEY, G.mode); } catch (e) {}
};
G.loadMode = function () {
  try { return localStorage.getItem(MODE_KEY) || ""; } catch (e) { return ""; }
};

/* ================= 启动 ================= */
G.boot = function () {
  cv = el("cv"); ctx = cv.getContext("2d");
  fadeEl = el("fade"); hsEl = el("hotspots"); invEl = el("inv");
  candleEl = el("candle"); captionEl = el("caption");
  narrEl = el("narr");
  narrEl.addEventListener("click", function () {
    G.touch();
    G.narrTap();
  });
  el("stage").addEventListener("pointerdown", function () { G.audio.ensure(); }, { once: true });
  window.addEventListener("resize", fit);
  fit();
  loadAll(function () {
    var savedMode = G.loadMode();
    if (savedMode) G.mode = savedMode;
    buildHotspots();
    if (window.initScenes) window.initScenes();
    // 第一页永远是题名。模式选择属于设置，入口在题名页「设 置」与游戏内 ☰。
    G.goto("title", { noSave: true });
    requestAnimationFrame(loop);
  });
};
})();

</script>
<script>
/* 《寒衣》场景与谜题：模式选择 / 题名 / 序章 / 门屋 / 正厅 / 井台 / 终章 */
(function () {
"use strict";
var W = 750, H = 1334;
function F(c, x, y, s, col, align) {
  c.fillStyle = col || "#C9C4B4";
  c.font = s + "px 'Songti SC','Noto Serif SC',serif";
  c.textAlign = align || "center";
}

/* ---------- 通用小件绘制 ---------- */
function drawPlaque(c, x, y, w, h, text, glow) {
  c.save();
  if (glow) { c.shadowColor = "rgba(180,74,60,0.5)"; c.shadowBlur = 14; }
  var g = c.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, "#3d2f22"); g.addColorStop(1, "#241a12");
  c.fillStyle = g;
  c.beginPath();
  if (c.roundRect) c.roundRect(x, y, w, h, 6); else c.rect(x, y, w, h);
  c.fill();
  c.shadowBlur = 0;
  c.strokeStyle = "rgba(200,180,148,0.25)"; c.lineWidth = 1.5; c.stroke();
  F(c, x + w / 2, y + h / 2 + 4, 30, "#E8DCC0");
  c.save();
  c.translate(x + w / 2, y + h / 2);
  c.rotate(Math.PI / 2);
  c.fillStyle = "#E8DCC0";
  c.font = "26px 'Songti SC',serif"; c.textAlign = "center";
  c.fillText(text, 0, 9);
  c.restore();
  c.restore();
}
function drawRope(c, x, y, w, hung) {
  c.save();
  c.strokeStyle = "#7a6c46"; c.lineWidth = 7; c.lineCap = "round";
  if (hung) {
    c.beginPath(); c.moveTo(x - w / 2, y); c.quadraticCurveTo(x, y + 16, x + w / 2, y); c.stroke();
    c.lineWidth = 2; c.strokeStyle = "rgba(40,34,18,0.6)";
    for (var i = -4; i <= 4; i++) {
      c.beginPath(); c.moveTo(x + i * w / 9 - 4, y + 2 + Math.abs(i) * -1.2);
      c.lineTo(x + i * w / 9 + 4, y + 6); c.stroke();
    }
  } else {
    c.beginPath(); c.ellipse(x, y, w / 2, w / 4.5, 0, 0, 6.283); c.stroke();
    c.beginPath(); c.ellipse(x, y, w / 3.2, w / 7, 0, 0, 6.283); c.stroke();
  }
  c.restore();
}
function drawTablet(c, x, y, w, h, name, inked, lit) {
  c.save();
  var g = c.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, "#33261a"); g.addColorStop(1, "#1c130c");
  c.fillStyle = g;
  c.beginPath();
  c.moveTo(x, y + h);
  c.lineTo(x, y + w / 2);
  c.arc(x + w / 2, y + w / 2, w / 2, Math.PI, 0);
  c.lineTo(x + w, y + h);
  c.closePath(); c.fill();
  c.strokeStyle = "rgba(200,180,148,0.2)"; c.lineWidth = 1; c.stroke();
  if (inked) {
    c.fillStyle = "rgba(8,8,8,0.92)";
    c.beginPath(); c.ellipse(x + w / 2, y + h * 0.42, w * 0.34, h * 0.16, 0.2, 0, 6.283); c.fill();
    c.beginPath(); c.ellipse(x + w / 2 - 4, y + h * 0.56, w * 0.3, h * 0.1, -0.3, 0, 6.283); c.fill();
  } else if (name) {
    F(c, x + w / 2, y + h * 0.30, 15, lit ? "#E8DCC0" : "#8a8577");
    var chars = name.split("");
    chars.forEach(function (ch, i) {
      c.save();
      c.translate(x + w / 2, y + h * 0.34 + i * 19 + 10);
      c.fillText(ch, 0, 0);
      c.restore();
    });
  }
  c.restore();
}
function drawMirror(c, x, y, r, turned, t) {
  c.save();
  c.strokeStyle = "#4a3b28"; c.lineWidth = 3;
  c.beginPath(); c.moveTo(x, y - r - 46); c.lineTo(x, y - r + 4); c.stroke();
  c.beginPath(); c.moveTo(x - 8, y - r - 40); c.lineTo(x, y - r - 28); c.lineTo(x + 8, y - r - 40); c.stroke();
  if (!turned) {
    var g = c.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    g.addColorStop(0, "#6e5a3c"); g.addColorStop(1, "#33271a");
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill();
    c.strokeStyle = "rgba(220,200,160,0.3)"; c.lineWidth = 2; c.stroke();
    c.strokeStyle = "rgba(30,22,12,0.5)"; c.lineWidth = 1;
    c.beginPath(); c.arc(x, y, r * 0.7, 0, 6.283); c.stroke();
  } else {
    var g2 = c.createLinearGradient(x - r, y - r, x + r, y + r);
    g2.addColorStop(0, "#aebfcc"); g2.addColorStop(0.5, "#5d6d78"); g2.addColorStop(1, "#2c363e");
    c.fillStyle = g2;
    c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill();
    c.strokeStyle = "rgba(255,220,180,0.55)"; c.lineWidth = 2.5; c.stroke();
    c.fillStyle = "rgba(255,255,255," + (0.10 + 0.05 * Math.sin(t * 0.8)) + ")";
    c.beginPath(); c.ellipse(x - r * 0.3, y - r * 0.35, r * 0.18, r * 0.34, 0.6, 0, 6.283); c.fill();
  }
  c.restore();
}
/* 针线缝字：虚线笔画 + 针脚 */
function stitchText(c, text, x, y, size, col) {
  c.save();
  c.fillStyle = col || "rgba(60,44,36,0.9)";
  c.strokeStyle = "rgba(60,44,36,0.55)";
  c.font = size + "px 'Songti SC',serif";
  c.textAlign = "center";
  var chars = text.split("");
  var total = chars.length * size * 1.15;
  var sx = x - total / 2 + size * 0.5;
  chars.forEach(function (ch, i) {
    var cx = sx + i * size * 1.15;
    c.setLineDash([3, 2.5]);
    c.lineWidth = 1.1;
    c.strokeText(ch, cx, y);
    c.setLineDash([]);
    c.fillText(ch, cx, y);
    c.strokeStyle = "rgba(120,90,70,0.5)"; c.lineWidth = 0.8;
    for (var k = -1; k <= 1; k++) {
      c.beginPath();
      c.moveTo(cx - size * 0.32, y + k * size * 0.22 - 3);
      c.lineTo(cx - size * 0.32, y + k * size * 0.22 + 3);
      c.stroke();
    }
    c.strokeStyle = "rgba(60,44,36,0.55)";
  });
  c.restore();
}

/* ---------- 考据卡 ---------- */

  if (f.w_named) {
    var nm = stitchedName();
    stitchText(c, nm, x, y + 8, 21);
  }
  if (burning) {
    var p = Math.min(1, (G.t - f.w_burning) / 3.2);
    c.globalCompositeOperation = "lighter";
    var gl = 0.5 + 0.5 * Math.sin(t * 8);
    c.fillStyle = "rgba(255,150,80," + (0.5 * p * gl + 0.3 * p) + ")";
    c.beginPath(); c.arc(x, y - 10, 30 + p * 30, 0, 6.283); c.fill();
  }
  c.restore();
}
function stitchedName() {
  return G.name || G.writtenName || "客";
}
G.pickColor = function (col) {
  var f = G.flags;
  f.w_color = col;
  G.closeModal();
  G.say([{ t: "五色纸放在石凳上。裁成衣的样子，长一尺有咫。" }], function () { G.save(); });
};
G.writeName = function () {
  var v = (document.getElementById("nm2").value || "").trim().slice(0, 6);
  G.writtenName = v;
  var f = G.flags;
  f.w_named = true;
  G.ui("");
  revealAndBurn(f, true);
};
function revealAndBurn(f, fresh) {
  if (f.w_burning || f.w_burned) return;
  f.w_burning = G.t;
  G.busy = true;
  G.setInv([]);
  var nm = stitchedName();
  var seq = [
    { t: "你拿起纸衣——" },
    { t: "上面已经有名字了。" },
    { t: "（停了一停。）" },
    { t: "是针线缝上去的。缝了很久。" },
    { t: "是你的名字。" + (nm ? "（" + nm + "）" : ""), note: { title: "送寒衣 · 授衣", body: "十月初一，生者授衣，亡者送寒衣。<br>《礼记·月令》：是月也，天子始裘。<br>宋·吕希哲《岁时杂记》：十月朔，京师将校禁卫以上，并赐锦袍。<br><b>这一天既给活人添冬衣，也给逝去的人送寒衣。</b>" } },
    { t: "你把它放进了火里。" }
  ];
  G.say(seq, function () {
    G.audio.burn(3.2);
    G.audio.caption("【火声】");
    G.setParticles("ember", { x: 470, y: 1000, w: 140, h: 20 });
    setTimeout(function () {
      f.w_burned = true;
      G.save();
      G.goto("finale");
    }, 3600);
  });
}
